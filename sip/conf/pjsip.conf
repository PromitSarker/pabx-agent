; Rendered by entrypoint.sh -- do not put secrets here, they come from env.
[global]
type=global
user_agent=Babuland-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${SIP_LOCAL_PORT}

[adn-auth]
type=auth
auth_type=userpass
username=${SIP_USER}
password=${SIP_PASSWORD}

[adn]
type=aor
contact=sip:${SIP_HOST}:${SIP_PORT}
qualify_frequency=0

[adn]
type=endpoint
transport=transport-udp
context=sip-inbound
disallow=all
allow=alaw
allow=ulaw
aors=adn
outbound_auth=adn-auth
from_user=${SIP_USER}
from_domain=${SIP_HOST}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

; Only the ADN softswitch is accepted as a source of SIP traffic.
[adn]
type=identify
endpoint=adn
match=${SIP_HOST}

[adn-reg]
type=registration
transport=transport-udp
outbound_auth=adn-auth
server_uri=sip:${SIP_HOST}:${SIP_PORT}
client_uri=sip:${SIP_USER}@${SIP_HOST}:${SIP_PORT}
contact_user=${SIP_USER}
retry_interval=60
forbidden_retry_interval=300
expiration=300
