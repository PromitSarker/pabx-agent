[general]
static=yes
writeprotect=no

; Calls arriving from the carrier are not handled by the AI (outbound-only for now).
[sip-inbound]
exten => _X.,1,NoOp(Rejecting inbound call to ${EXTEN})
 same => n,Hangup(21)
exten => _+X.,1,Hangup(21)

; Used by call files written by the sip-bridge service. Runs once the callee answers.
[ai-bridge]
exten => s,1,NoOp(AI call ${CALL_UUID})
 same => n,Set(TIMEOUT(absolute)=${SIP_MAX_CALL_SECONDS})
 same => n,AudioSocket(${CALL_UUID},${AUDIOSOCKET_ADDR})
 same => n,Hangup()
